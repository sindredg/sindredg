<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="sindrg.com">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16303f"/>
      <stop offset="1" stop-color="#224154"/>
    </linearGradient>
    <pattern id="fdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8aa3b1" opacity="0.13"/>
    </pattern>
    <radialGradient id="planet" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#6d9db8"/>
      <stop offset="0.55" stop-color="#3a6880"/>
      <stop offset="1" stop-color="#16303f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.6" stop-color="#f2b134" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f2b134" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fcard">
      <rect width="840" height="220" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#fcard)">
    <rect width="840" height="220" fill="url(#fbg)"/>
    <rect width="840" height="220" fill="url(#fdots)"/>

    <g fill="#e6eef2">
      <circle cx="132" cy="48" r="1.6" opacity="0.5"/>
      <circle cx="238" cy="150" r="1.2" opacity="0.35"/>
      <circle cx="684" cy="62" r="1.5" opacity="0.45"/>
      <circle cx="742" cy="148" r="1.2" opacity="0.3"/>
      <circle cx="94" cy="128" r="1.1" opacity="0.28"/>
      <circle cx="606" cy="176" r="1.3" opacity="0.32"/>
    </g>

    <circle cx="420" cy="98" r="92" fill="url(#halo)"/>

    <!-- orbits, drawn behind the planet so the rings pass around it -->
    <g transform="rotate(-18 420 98)" fill="none" stroke="#4f6f82">
      <path id="oA" d="M308,98 a112,30 0 1,0 224,0 a112,30 0 1,0 -224,0" stroke-width="1.5" opacity="0.95"/>
      <path id="oB" d="M258,98 a162,46 0 1,0 324,0 a162,46 0 1,0 -324,0" stroke-width="1.2" opacity="0.65"/>
      <path id="oC" d="M212,98 a208,60 0 1,0 416,0 a208,60 0 1,0 -416,0" stroke-width="1" opacity="0.4"/>
    </g>

    <circle cx="420" cy="98" r="36" fill="url(#planet)"/>
    <circle cx="420" cy="98" r="36" fill="none" stroke="#8aa3b1" stroke-opacity="0.35"/>

    <!-- near half of the inner ring, back on top so it crosses in front -->
    <g transform="rotate(-18 420 98)" fill="none" stroke="#4f6f82">
      <path d="M308,98 a112,30 0 0,0 224,0" stroke-width="1.5" opacity="0.95"/>
    </g>

    <g transform="rotate(-18 420 98)">
      <circle r="4" fill="#f2b134">
        <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"><mpath href="#oA" xlink:href="#oA"/></animateMotion>
      </circle>
      <circle r="3" fill="#c6d6df">
        <animateMotion dur="16s" begin="-4s" repeatCount="indefinite" calcMode="linear"><mpath href="#oB" xlink:href="#oB"/></animateMotion>
      </circle>
      <circle r="2.5" fill="#8aa3b1">
        <animateMotion dur="24s" begin="-9s" repeatCount="indefinite" calcMode="linear"><mpath href="#oC" xlink:href="#oC"/></animateMotion>
      </circle>
    </g>

    <rect x="0.5" y="0.5" width="839" height="219" rx="13.5" fill="none" stroke="#4f6f82" stroke-opacity="0.5"/>
  </g>

  <text x="420" y="206" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#b7c9d3" letter-spacing="0.4">sindrg.com</text>
</svg>
