<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Sindre Grytebust, cloud infrastructure and identity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16303f"/>
      <stop offset="1" stop-color="#224154"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="22%" r="58%">
      <stop offset="0" stop-color="#f2b134" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f2b134" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8aa3b1" opacity="0.13"/>
    </pattern>
    <clipPath id="card">
      <rect width="840" height="220" rx="14"/>
    </clipPath>
  </defs>

  <style>
    /* requests fan out from the router to whichever instance is free */
    .req  { offset-rotate: 0deg; animation: req 2.4s linear infinite; }
    .req1 { offset-path: path("M470,110 L640,110 L720,51"); }
    .req2 { offset-path: path("M470,110 L640,110 L720,89");  animation-delay: -0.8s; }
    .req3 { offset-path: path("M470,110 L640,110 L720,127"); animation-delay: -1.6s; }
    /* the fourth only runs while the extra instance is up */
    .req4 { offset-path: path("M470,110 L640,110 L720,165"); animation: req4 8s linear infinite; }

    /* responses travel back out the way they came */
    .res  { offset-rotate: 0deg; animation: res 2.4s linear infinite; }
    .res1 { offset-path: path("M720,89 L640,110 L470,110");  animation-delay: -0.4s; }
    .res2 { offset-path: path("M720,127 L640,110 L470,110"); animation-delay: -1.7s; }

    @keyframes req {
      0%   { offset-distance: 0%;   opacity: 0; }
      6%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes res {
      0%   { offset-distance: 0%;   opacity: 0; }
      8%   { opacity: 0.85; }
      90%  { opacity: 0.85; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    /* travels only in the window where the extra instance exists */
    @keyframes req4 {
      0%, 30%   { offset-distance: 0%;   opacity: 0; }
      34%       { opacity: 1; }
      60%       { opacity: 1; }
      64%, 100% { offset-distance: 100%; opacity: 0; }
    }

    /* instances light up as a request lands */
    .inst  { animation: hit 2.4s linear infinite; }
    .inst2 { animation-delay: -0.8s; }
    .inst3 { animation-delay: -1.6s; }
    @keyframes hit {
      0%, 88% { stroke: #4f6f82; }
      93%     { stroke: #f2b134; }
      100%    { stroke: #4f6f82; }
    }

    /* the pool scales up under load, then back down */
    .scale { animation: scale 8s ease-in-out infinite; }
    @keyframes scale {
      0%, 26%   { opacity: 0; }
      34%, 60%  { opacity: 1; }
      68%, 100% { opacity: 0; }
    }

    .ping { transform-box: view-box; transform-origin: 640px 110px; animation: ping 2.4s ease-out infinite; }
    @keyframes ping {
      from { transform: scale(0.6); opacity: 0.5; }
      to   { transform: scale(2.2); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .req, .res, .ping, .inst, .scale { animation: none; }
      .req, .res, .ping { opacity: 0; }
      .scale { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="220" fill="url(#bg)"/>
    <rect width="840" height="220" fill="url(#dots)"/>
    <rect width="840" height="220" fill="url(#glow)"/>
    <rect x="0.5" y="0.5" width="839" height="219" rx="13.5" fill="none" stroke="#4f6f82" stroke-opacity="0.5"/>
  </g>

  <g clip-path="url(#card)">
    <!-- inbound traffic, and the fan-out to each instance -->
    <g stroke="#4f6f82" stroke-width="1.5" fill="none">
      <path d="M470,110 L626,110"/>
      <path d="M654,110 L720,51" stroke-width="1.2" opacity="0.75"/>
      <path d="M654,110 L720,89" stroke-width="1.2" opacity="0.75"/>
      <path d="M654,110 L720,127" stroke-width="1.2" opacity="0.75"/>
      <path class="scale" d="M654,110 L720,165" stroke-width="1.2" opacity="0.75"/>
    </g>

    <!-- the router: everything in and out passes through here -->
    <circle class="ping" cx="640" cy="110" r="14" fill="none" stroke="#f2b134" stroke-width="1.5"/>
    <path d="M640,95 L655,110 L640,125 L625,110 Z" fill="#1f3b4d" stroke="#e6eef2" stroke-width="1.5"/>

    <!-- service instances; the fourth comes and goes with load -->
    <g fill="#ffffff" fill-opacity="0.05" stroke="#4f6f82" stroke-width="1.5">
      <rect class="inst" x="720" y="42" width="44" height="18" rx="4"/>
      <rect class="inst inst2" x="720" y="80" width="44" height="18" rx="4"/>
      <rect class="inst inst3" x="720" y="118" width="44" height="18" rx="4"/>
      <rect class="scale" x="720" y="156" width="44" height="18" rx="4"/>
    </g>

    <circle class="req req1" r="3.5" fill="#f2b134"/>
    <circle class="req req2" r="3.5" fill="#f2b134"/>
    <circle class="req req3" r="3.5" fill="#f2b134"/>
    <circle class="req req4" r="3.5" fill="#f2b134"/>
    <circle class="res res1" r="2.8" fill="#c6d6df"/>
    <circle class="res res2" r="2.8" fill="#c6d6df"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="44" y="92" font-size="40" font-weight="600" fill="#eef4f7" letter-spacing="-0.5">Sindre Grytebust</text>
    <rect x="45" y="110" width="52" height="3" rx="1.5" fill="#f2b134"/>
    <text x="44" y="146" font-size="16.5" fill="#b7c9d3">Cloud infrastructure, platforms and identity.</text>
    <text x="44" y="172" font-size="12.5" fill="#8aa3b1" letter-spacing="0.4">CLOUD &#183; KUBERNETES &#183; TERRAFORM &#183; IDENTITY &#183; AUTOMATION</text>
  </g>
</svg>
