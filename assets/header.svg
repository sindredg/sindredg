<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
<title id="title">Sindre Grytebust — Infrastructure. Identity. Security.</title>
<desc id="desc">Mint typography and an abstract layered network on a midnight background.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#263437" stroke-opacity=".45"/></pattern>
  <radialGradient id="glow"><stop stop-color="#22483f"/><stop offset="1" stop-color="#101719"/></radialGradient>
  <linearGradient id="plane" x2="1" y2="1"><stop stop-color="#21433b"/><stop offset="1" stop-color="#111d20"/></linearGradient>
  <clipPath id="clip"><rect width="960" height="320" rx="18"/></clipPath>
</defs>
<style>
.flow {stroke-dasharray:5 12; animation:flow 8s linear infinite}
@keyframes flow {to {stroke-dashoffset:-170}}
@media(prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<g clip-path="url(#clip)">
<rect width="960" height="320" fill="#101719"/>
<ellipse cx="775" cy="155" rx="250" ry="240" fill="url(#glow)"/>
<rect width="960" height="320" fill="url(#grid)"/>
<path d="M0 0H960" stroke="#a7f3c8" stroke-width="4"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="42" y="51" font-family="Consolas,monospace" font-size="14" letter-spacing="3" fill="#a7f3c8">SINDRE GRYTEBUST</text>
<text x="39" y="126" font-size="56" font-weight="700" letter-spacing="-2" fill="#f0f5f2">Infrastructure.</text>
<text x="39" y="192" font-size="56" font-weight="700" letter-spacing="-2" fill="#a7f3c8">Identity. Security.</text>
<text x="42" y="236" font-size="16" fill="#aebfba">Built in the cloud. Tested in practice.</text>
<text x="42" y="283" font-family="Consolas,monospace" font-size="11" letter-spacing="1.7" fill="#aebfba">TERRAFORM / KUBERNETES / ENTRA ID</text>
</g>
<g stroke-linejoin="round">
<path d="M621 179L757 247L893 179L757 111Z" fill="#162422" stroke="#46675c"/>
<path d="M621 148L757 216L893 148L757 80Z" fill="url(#plane)" stroke="#769e8d"/>
