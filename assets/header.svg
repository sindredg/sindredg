<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Sindre Grytebust — cloud infrastructure, platforms and identity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16303f"/>
      <stop offset="1" stop-color="#224154"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="22%" r="58%">
      <stop offset="0" stop-color="#f2b134" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f2b134" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8aa3b1" opacity="0.13"/>
    </pattern>
    <clipPath id="card">
      <rect width="840" height="220" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="840" height="220" fill="url(#bg)"/>
    <rect width="840" height="220" fill="url(#dots)"/>
    <rect width="840" height="220" fill="url(#glow)"/>
    <rect x="0.5" y="0.5" width="839" height="219" rx="13.5" fill="none" stroke="#4f6f82" stroke-opacity="0.5"/>
  </g>

  <!-- identity topology: one source of identity, three clouds -->
  <g stroke="#4f6f82" stroke-width="1.5" fill="none">
    <path id="l1" d="M600,104 L712,48"/>
    <path id="l2" d="M600,104 L712,104"/>
    <path id="l3" d="M600,104 L712,160"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <g fill="none" stroke="#4f6f82" stroke-width="1">
      <rect x="730" y="36" width="68" height="24" rx="12" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="730" y="92" width="68" height="24" rx="12" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="730" y="148" width="68" height="24" rx="12" fill="#ffffff" fill-opacity="0.04"/>
    </g>
    <g font-size="12" fill="#c6d6df" text-anchor="middle">
      <text x="764" y="52">Azure</text>
      <text x="764" y="108">AWS</text>
      <text x="764" y="164">GCP</text>
      <text x="600" y="140" fill="#b7c9d3">Entra ID</text>
    </g>
  </g>

  <circle cx="600" cy="104" r="10" fill="none" stroke="#f2b134" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="10;28" dur="3s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="104" r="9" fill="#e6eef2"/>

  <g fill="#8aa3b1">
    <circle cx="712" cy="48" r="5"><animate attributeName="fill" values="#8aa3b1;#8aa3b1;#f2b134;#8aa3b1;#8aa3b1" keyTimes="0;0.15;0.17;0.4;1" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="712" cy="104" r="5"><animate attributeName="fill" values="#8aa3b1;#8aa3b1;#f2b134;#8aa3b1;#8aa3b1" keyTimes="0;0.15;0.17;0.4;1" dur="8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="712" cy="160" r="5"><animate attributeName="fill" values="#8aa3b1;#8aa3b1;#f2b134;#8aa3b1;#8aa3b1" keyTimes="0;0.15;0.17;0.4;1" dur="8s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#f2b134">
    <circle r="3.5" opacity="0">
      <animateMotion dur="8s" begin="1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.15;1" calcMode="linear"><mpath href="#l1" xlink:href="#l1"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.16;1" dur="8s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="8s" begin="1.2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.15;1" calcMode="linear"><mpath href="#l2" xlink:href="#l2"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.16;1" dur="8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="8s" begin="1.4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.15;1" calcMode="linear"><mpath href="#l3" xlink:href="#l3"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.16;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="44" y="92" font-size="40" font-weight="600" fill="#eef4f7" letter-spacing="-0.5">Sindre Grytebust</text>
    <rect x="45" y="110" width="52" height="3" rx="1.5" fill="#f2b134"/>
    <text x="44" y="146" font-size="16.5" fill="#b7c9d3">Cloud infrastructure, platforms and identity.</text>
    <text x="44" y="172" font-size="12.5" fill="#8aa3b1" letter-spacing="0.4">CLOUD &#183; KUBERNETES &#183; TERRAFORM &#183; IDENTITY &#183; AUTOMATION</text>
  </g>
</svg>
