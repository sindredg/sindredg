<path d="M739 114V102A18 18 0 0 1 775 102V114" fill="none" stroke="#d4c5ff" stroke-width="3"/>
<rect x="735" y="110" width="44" height="33" rx="6" fill="#152321" stroke="#d4c5ff" stroke-width="2"/>
