<text x="36" y="143" font-size="24" font-weight="400" fill="#adcbb8">Infrastructure, identity</text>
<text x="36" y="176" font-size="24" font-weight="400" fill="#adcbb8">and security.</text>
<text x="36" y="223" font-size="12" fill="#a2b4aa">Terraform · Kubernetes · Entra ID</text>
