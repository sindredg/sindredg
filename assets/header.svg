<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Sindre Grytebust</title>
  <desc id="desc">An abstract cluster that heals itself. Three nodes send heartbeats to a control plane. One node fails and its heartbeats stop; the control plane notices the missed heartbeat and reschedules its workloads onto the other two. When the node reports again, workloads are scheduled back onto it.</desc>
  <defs>
    <radialGradient id="wash" cx="76%" cy="48%" r="58%">
      <stop stop-color="#253e32" stop-opacity=".45"/>
      <stop offset="1" stop-color="#111a18" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#8caa98" opacity=".12"/></pattern>
    <clipPath id="frame"><rect width="960" height="240" rx="14"/></clipPath>
  </defs>
  <style>
    .point { offset-rotate:0deg; opacity:0; animation:travel 6s linear infinite; }
    .client { offset-path:path('M492 120 L600 120'); animation-duration:3s; }
    .upper { offset-path:path('M654 120 C712 120 716 59 792 59'); }
    .middle { offset-path:path('M654 120 L830 120'); animation-delay:-3s; }
    .lower { offset-path:path('M654 120 C712 120 716 181 792 181'); animation-delay:-4s; }

    /* Heartbeats: each node reports every 3 s, landing one second apart. The API square flashes as each one lands. */
    .report { animation-name:report; animation-duration:3s; }
    .upper-back { offset-path:path('M792 67 C726 67 716 124 650 124'); }
    .middle-back { offset-path:path('M830 128 L646 128'); animation-delay:-2s; }
    .lower-back { offset-path:path('M792 173 C726 173 716 116 650 116'); animation-delay:-1s; }
    .beat { opacity:0; animation:beat 3s linear infinite; }
    .b-middle { animation-delay:-2s; }
    .b-lower { animation-delay:-1s; }

    /* One 18 s cycle.
        5 s  the lower node dies and its heartbeats stop; the control plane still sends to it.
        8 s  the heartbeat due now is missed: the node is marked and its pods are rescheduled.
       11 s  the node is back and reports again.
       14 s  that heartbeat lands: the mark clears and pods are scheduled back onto the node. */
    .node { animation:node 18s ease-in-out infinite; }
    .alive { animation:alive 18s linear infinite; }
    .heard { animation:heard 18s linear infinite; }
    .notice { opacity:0; animation:notice 18s ease-out infinite; }
    .fault { opacity:0; animation:marked 18s ease-in-out infinite; }
    .link { animation:link 18s ease-in-out infinite; }
    .cut { animation:cut 18s linear infinite; }
    .evicted { animation:evicted 18s ease-in-out infinite; }
    .moved { opacity:0; animation:moved 18s ease-in-out infinite; }
    .sched { offset-rotate:0deg; opacity:0; animation:sched 18s linear infinite; }
    .s-upper { offset-path:path('M654 120 C712 120 716 59 792 59'); }
    .s-middle { offset-path:path('M654 120 L830 120'); }
    .s-lower { offset-path:path('M654 120 C712 120 716 181 792 181'); animation-name:sched-back; }
    .d1 { animation-delay:.5s; }
    .d2 { animation-delay:1s; }
    @keyframes travel { 0%{offset-distance:0%;opacity:0} 12%,82%{opacity:.8} 100%{offset-distance:100%;opacity:0} }
    @keyframes report { 0%{offset-distance:0%;opacity:0} 8%,92%{opacity:1} 100%{offset-distance:100%;opacity:0} }
    @keyframes beat { 0%,100%{opacity:.8} 16%,90%{opacity:0} }
    @keyframes node { 0%,27.8%{opacity:1} 29.5%,61.1%{opacity:.35} 63%,100%{opacity:1} }
    @keyframes alive { 0%,27.5%{opacity:1} 27.8%,61%{opacity:0} 61.1%,100%{opacity:1} }
    @keyframes heard { 0%,31%{opacity:1} 31.2%,75.4%{opacity:0} 75.6%,100%{opacity:1} }
    @keyframes notice { 0%,44.4%{opacity:0} 45.5%{opacity:.9} 53%,100%{opacity:0} }
    @keyframes marked { 0%,44.4%{opacity:0} 46%,77.8%{opacity:.9} 80%,100%{opacity:0} }
    @keyframes link { 0%,44.4%{opacity:1} 46%,77.8%{opacity:.3} 80%,100%{opacity:1} }
    @keyframes cut { 0%,44.3%{opacity:1} 44.5%,77.7%{opacity:0} 77.8%,100%{opacity:1} }
    @keyframes sched { 0%,46%{offset-distance:0%;opacity:0} 46.6%,51.4%{opacity:1} 52%,100%{offset-distance:100%;opacity:0} }
    @keyframes sched-back { 0%,80%{offset-distance:0%;opacity:0} 80.6%,85.4%{opacity:1} 86%,100%{offset-distance:100%;opacity:0} }
    @keyframes moved { 0%,52%{opacity:0} 53.5%,80%{opacity:1} 82%,100%{opacity:0} }
    @keyframes evicted { 0%,46%{opacity:1} 48%,86%{opacity:0} 87.5%,100%{opacity:1} }
    @media(prefers-reduced-motion:reduce) {
      .point,.sched {animation:none;display:none}
      .beat,.node,.alive,.heard,.notice,.fault,.link,.cut,.evicted,.moved {animation:none}
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="960" height="240" fill="#111a18"/>
    <rect width="960" height="240" fill="url(#wash)"/>
    <path d="M466 20H940V220H466Z" fill="url(#dots)"/>
    <text x="42" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="500" fill="#e0e9e4">Sindre Grytebust</text>

    <g fill="none" stroke-width="1.2">
      <path d="M492 120H830M654 120C712 120 716 59 792 59" stroke="#526f5e"/>
      <path d="M792 67C726 67 716 124 650 124M830 128H646" stroke="#8d86b3" stroke-opacity=".7"/>
      <g class="link">
        <path d="M654 120C712 120 716 181 792 181" stroke="#526f5e"/>
        <path d="M792 173C726 173 716 116 650 116" stroke="#8d86b3" stroke-opacity=".7"/>
      </g>
      <circle cx="627" cy="120" r="44" stroke="#536d5e" stroke-opacity=".2"/>
      <circle class="notice" cx="627" cy="120" r="44" stroke="#c9957a"/>
    </g>
    <circle cx="492" cy="120" r="4" fill="#99b5a2"/>
    <rect x="608" y="101" width="38" height="38" rx="9" transform="rotate(45 627 120)" fill="#1d3025" stroke="#91ad99" stroke-width="1.2"/>
    <rect x="620" y="113" width="14" height="14" rx="4" fill="#aecbb6" fill-opacity=".55"/>
    <g fill="#d4c5ff">
      <rect class="beat" x="620" y="113" width="14" height="14" rx="4"/>
      <rect class="beat b-middle" x="620" y="113" width="14" height="14" rx="4"/>
      <g class="heard"><rect class="beat b-lower" x="620" y="113" width="14" height="14" rx="4"/></g>
    </g>

    <g fill="#18271f" stroke="#66816f" stroke-width="1">
      <rect x="792" y="39" width="92" height="40" rx="10"/>
      <rect x="830" y="100" width="92" height="40" rx="10"/>
    </g>
    <g fill="#a8c1b0" fill-opacity=".65">
      <circle cx="811" cy="59" r="2.5"/><circle cx="825" cy="59" r="2.5"/><circle cx="839" cy="59" r="2.5"/>
      <circle cx="849" cy="120" r="2.5"/><circle cx="863" cy="120" r="2.5"/><circle cx="877" cy="120" r="2.5"/>
    </g>
    <g fill="#a8c1b0" fill-opacity=".65">
      <circle class="moved" cx="853" cy="59" r="2.5"/>
      <circle class="moved d1" cx="891" cy="120" r="2.5"/>
      <circle class="moved d2" cx="905" cy="120" r="2.5"/>
    </g>

    <g class="node">
      <rect x="792" y="161" width="92" height="40" rx="10" fill="#18271f" stroke="#66816f"/>
      <g fill="#a8c1b0" fill-opacity=".65">
        <circle class="evicted" cx="811" cy="181" r="2.5"/><circle class="evicted d1" cx="825" cy="181" r="2.5"/><circle class="evicted d2" cx="839" cy="181" r="2.5"/>
      </g>
    </g>
    <rect class="fault" x="792" y="161" width="92" height="40" rx="10" fill="none" stroke="#c9957a" stroke-width="1.2" stroke-dasharray="4 4"/>

    <circle class="point client" r="2.5" fill="#b5d0bc"/>
    <circle class="point upper" r="2.5" fill="#b5d0bc"/>
    <circle class="point middle" r="2.5" fill="#b5d0bc"/>
    <g class="cut"><circle class="point lower" r="2.5" fill="#b5d0bc"/></g>
    <circle class="point report upper-back" r="2.5" fill="#d4c5ff"/>
    <circle class="point report middle-back" r="2.5" fill="#d4c5ff"/>
    <g class="alive"><circle class="point report lower-back" r="2.5" fill="#d4c5ff"/></g>
    <g fill="#e7f2ea">
      <circle class="sched s-upper" r="3"/>
      <circle class="sched s-middle d1" r="3"/>
      <circle class="sched s-middle d2" r="3"/>
      <circle class="sched s-lower" r="3"/>
      <circle class="sched s-lower d1" r="3"/>
      <circle class="sched s-lower d2" r="3"/>
    </g>
  </g>
</svg>
