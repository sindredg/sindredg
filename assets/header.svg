<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
<title id="title">Sindre Grytebust — infrastructure, identity and security</title>
<desc id="desc">Illustrative Kubernetes cluster. Kubelets watch the API server for assigned work and report status. Two nodes stay present while a third is provisioned, runs pods, and is removed through node autoscaling. This shows management communication, not application traffic.</desc>
<defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#20302b" stroke-opacity=".45"/></pattern><clipPath id="clip"><rect width="960" height="320" rx="14"/></clipPath></defs>
<style>
.packet { offset-rotate:0deg; opacity:0; animation:packet 4s linear infinite; }
.watch1 { offset-path:path('M559 153 L607 153 L644 73 L694 73'); }
.watch2 { offset-path:path('M559 153 L694 158'); animation-delay:-2s; }
.status1 { offset-path:path('M694 80 L649 80 L612 164 L559 164'); animation-delay:-1s; }
.status2 { offset-path:path('M694 166 L559 166'); animation-delay:-3s; }
.watch3 { offset-path:path('M559 153 L607 153 L644 243 L694 243'); }
.status3 { offset-path:path('M694 250 L649 250 L612 164 L559 164'); animation-delay:-2s; }
.extra { animation:node 16s ease-in-out infinite; }
.extra-pods { animation:pods 16s ease-in-out infinite; }
.extra-traffic { animation:traffic 16s ease-in-out infinite; }
@keyframes packet { 0%{offset-distance:0%;opacity:0} 12%,85%{opacity:.85} 100%{offset-distance:100%;opacity:0} }
@keyframes node {0%,22%,96%,100%{opacity:0} 32%,86%{opacity:1}}
@keyframes pods {0%,38%,86%,100%{opacity:0} 48%,74%{opacity:1}}
@keyframes traffic {0%,32%,88%,100%{opacity:0} 42%,78%{opacity:1}}
@media(prefers-reduced-motion:reduce){.packet{animation:none;display:none}.extra,.extra-pods,.extra-traffic{animation:none;opacity:1}}
</style>
<g clip-path="url(#clip)">
<rect width="960" height="320" fill="#111a18"/><rect width="960" height="320" fill="url(#grid)"/>
<g font-family="Segoe UI,Arial,sans-serif">
