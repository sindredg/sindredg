<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Sindre Grytebust, cloud infrastructure and identity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16303f"/>
      <stop offset="1" stop-color="#224154"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="22%" r="58%">
      <stop offset="0" stop-color="#f2b134" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f2b134" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8aa3b1" opacity="0.13"/>
    </pattern>
    <clipPath id="card">
      <rect width="840" height="220" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .wheel { animation: spin 24s linear infinite; }
    .pulse { animation: pulse 3.2s ease-out infinite; }
    .replica { animation: replica 6s ease-in-out infinite; }
    .replica-l { animation-delay: -1s; }
    .replica-r { animation-delay: -4s; }
    .wheel, .pulse { transform-box: view-box; transform-origin: 690px 88px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      from { transform: scale(1); opacity: 0.55; }
      to   { transform: scale(2.6); opacity: 0; }
    }
    @keyframes replica {
      0%, 8%     { opacity: 0; }
      16%, 70%   { opacity: 1; }
      78%, 100%  { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wheel, .pulse, .replica { animation: none; }
      .replica { opacity: 1; }
      .pulse { opacity: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="220" fill="url(#bg)"/>
    <rect width="840" height="220" fill="url(#dots)"/>
    <rect width="840" height="220" fill="url(#glow)"/>
    <rect x="0.5" y="0.5" width="839" height="219" rx="13.5" fill="none" stroke="#4f6f82" stroke-opacity="0.5"/>
  </g>

  <!-- kubernetes: the helm wheel, with replicas scaling underneath -->
  <g>
    <g class="wheel" stroke="#4f6f82" stroke-width="2" fill="none" stroke-linejoin="round">
      <path d="M690.00,36.00 L730.66,55.58 L740.70,99.57 L712.56,134.85 L667.44,134.85 L639.30,99.57 L649.34,55.58 Z" stroke="#6e8ea1"/>
      <path d="M690.00,74.00 L690.00,46.00"/>
      <path d="M700.95,79.27 L722.84,61.81"/>
      <path d="M703.65,91.12 L730.95,97.35"/>
      <path d="M696.07,100.61 L708.22,125.84"/>
      <path d="M683.93,100.61 L671.78,125.84"/>
      <path d="M676.35,91.12 L649.05,97.35"/>
      <path d="M679.05,79.27 L657.16,61.81"/>
    </g>
    <circle class="pulse" cx="690" cy="88" r="12" fill="none" stroke="#f2b134" stroke-width="1.5" opacity="0"/>
    <circle cx="690" cy="88" r="9" fill="#e6eef2"/>
  </g>

  <g>
    <rect x="663.5" y="158" width="13" height="13" rx="3" fill="#8aa3b1"/>
    <rect x="683.5" y="158" width="13" height="13" rx="3" fill="#8aa3b1"/>
    <rect x="703.5" y="158" width="13" height="13" rx="3" fill="#8aa3b1"/>
    <rect class="replica replica-l" x="643.5" y="158" width="13" height="13" rx="3" fill="#f2b134" opacity="0"/>
    <rect class="replica replica-r" x="723.5" y="158" width="13" height="13" rx="3" fill="#f2b134" opacity="0"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="44" y="92" font-size="40" font-weight="600" fill="#eef4f7" letter-spacing="-0.5">Sindre Grytebust</text>
    <rect x="45" y="110" width="52" height="3" rx="1.5" fill="#f2b134"/>
    <text x="44" y="146" font-size="16.5" fill="#b7c9d3">Cloud infrastructure, platforms and identity.</text>
    <text x="44" y="172" font-size="12.5" fill="#8aa3b1" letter-spacing="0.4">CLOUD &#183; KUBERNETES &#183; TERRAFORM &#183; IDENTITY &#183; AUTOMATION</text>
  </g>
</svg>
