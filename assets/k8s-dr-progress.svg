<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170" role="img" aria-labelledby="t d">
  <title id="t">Kubernetes disaster recovery progress</title>
  <desc id="d">Eight disaster recovery milestones. Complete: Contract, Infrastructure, Kubernetes, Service. Remaining: Backups, Cold recovery, Drill, Faster recovery.</desc>
  <rect width="960" height="170" rx="10" fill="#101719"/>
  <rect x="22" y="22" width="450" height="126" rx="10" fill="#15211d" stroke="#2f463d"/>
  <text x="40" y="47" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#9fb3ab">Primary region</text>
  <rect x="572" y="22" width="366" height="126" rx="10" fill="none" stroke="#3e544b" stroke-dasharray="5 5"/>
  <text x="590" y="47" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#9fb3ab">Recovery region, cold until a drill</text>
  <path d="M74 84H522" stroke="#a7f3c8" stroke-opacity=".7" stroke-width="2"/>
  <path d="M522 84H858" stroke="#3e544b" stroke-width="2" stroke-dasharray="3 5"/>
  <circle cx="74" cy="84" r="12" fill="#a7f3c8"/><text x="74" y="88.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#101719">0</text>
  <text x="74" y="124" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#dfeae5">Contract</text>
  <circle cx="186" cy="84" r="12" fill="#a7f3c8"/><text x="186" y="88.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#101719">1</text>
  <text x="186" y="124" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#dfeae5">Infrastructure</text>
  <circle cx="298" cy="84" r="12" fill="#a7f3c8"/><text x="298" y="88.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#101719">2</text>
  <text x="298" y="124" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#dfeae5">Kubernetes</text>
  <circle cx="410" cy="84" r="12" fill="#a7f3c8"/><text x="410" y="88.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#101719">3</text>
  <text x="410" y="124" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#dfeae5">Service</text>
  <circle cx="522" cy="84" r="18" fill="none" stroke="#a7f3c8" stroke-opacity=".3"/><circle cx="522" cy="84" r="12" fill="#101719" stroke="#a7f3c8" stroke-width="2"/><text x="522" y="88.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#a7f3c8">4</text>
  <text x="522" y="124" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#a7f3c8">Backups</text>
  <circle cx="634" cy="84" r="12" fill="#101719" stroke="#4a6158"/><text x="634" y="88.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b9d96">5</text>
  <text x="634" y="124" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#8b9d96">Cold recovery</text>
  <circle cx="746" cy="84" r="12" fill="#101719" stroke="#4a6158"/><text x="746" y="88.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b9d96">6</text>
  <text x="746" y="124" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#8b9d96">Drill</text>
  <circle cx="858" cy="84" r="12" fill="#101719" stroke="#4a6158"/><text x="858" y="88.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b9d96">7</text>
  <text x="858" y="124" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#8b9d96">Faster recovery</text>
