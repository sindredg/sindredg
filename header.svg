<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-label="Sindre, cloud infrastructure and identity" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="840" height="200" rx="12" fill="#1f3b4d"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze"/>
    <text x="40" y="90" font-size="44" font-weight="600" fill="#e6eef2">Sindre</text>
    <text x="40" y="126" font-size="17" fill="#b7c9d3">I build and document cloud platforms and identity systems.</text>
    <text x="40" y="154" font-size="14" fill="#8aa3b1">Entra ID, Azure, AWS and GCP, built with Terraform.</text>
  </g>
  <g stroke="#4f6f82" stroke-width="1.5">
    <path id="l1" d="M600,100 L740,48" fill="none"/>
    <path id="l2" d="M600,100 L740,100" fill="none"/>
    <path id="l3" d="M600,100 L740,152" fill="none"/>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#b7c9d3">
    <text x="600" y="128" text-anchor="middle">Entra ID</text>
    <text x="752" y="52">Azure</text>
    <text x="752" y="104">AWS</text>
    <text x="752" y="156">GCP</text>
  </g>
  <circle cx="600" cy="100" r="9" fill="#e6eef2"/>
  <g fill="#8aa3b1">
    <circle cx="740" cy="48" r="5"><animate attributeName="fill" values="#8aa3b1;#8aa3b1;#f2b134;#8aa3b1;#8aa3b1" keyTimes="0;0.15;0.17;0.4;1" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="100" r="5"><animate attributeName="fill" values="#8aa3b1;#8aa3b1;#f2b134;#8aa3b1;#8aa3b1" keyTimes="0;0.15;0.17;0.4;1" dur="8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="152" r="5"><animate attributeName="fill" values="#8aa3b1;#8aa3b1;#f2b134;#8aa3b1;#8aa3b1" keyTimes="0;0.15;0.17;0.4;1" dur="8s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#f2b134">
    <circle r="3.5" opacity="0">
      <animateMotion dur="8s" begin="1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.15;1" calcMode="linear"><mpath href="#l1"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.16;1" dur="8s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="8s" begin="1.2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.15;1" calcMode="linear"><mpath href="#l2"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.16;1" dur="8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="8s" begin="1.4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.15;1" calcMode="linear"><mpath href="#l3"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.16;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
